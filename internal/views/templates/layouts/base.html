{{define "base"}}<!doctype html>
<html lang="{{.Lang}}"{{if .Mood}} data-mood="{{.Mood}}"{{end}}>
<head>
{{template "head" .}}
</head>
<body class="{{block "bodyclass" .}}{{end}}">
{{template "nav" .}}
<main id="main">
{{block "content" .}}{{end}}
</main>
{{template "footer" .}}
<script type="module" src="{{asset "site.js"}}"></script>
{{range .Scripts}}<script type="module" src="{{asset .}}"></script>
{{end}}{{if .DevReload}}<script src="/__dev/reload.js"></script>
{{end}}
</body>
</html>{{end}}
