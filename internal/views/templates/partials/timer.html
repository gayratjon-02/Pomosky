{{define "timer"}}
<div class="timer" id="timer">
  <svg class="timer-ring" viewBox="0 0 260 260" aria-hidden="true">
    <circle class="ring-track" cx="130" cy="130" r="120"/>
    <circle class="ring-progress" id="ring-progress" cx="130" cy="130" r="120"/>
  </svg>
  <div class="timer-inner">
    <span class="timer-phase" id="timer-phase">Connecting</span>
    <span class="timer-digits" id="timer-digits" role="timer" aria-live="off">--:--</span>
    <span class="timer-label" id="timer-label"></span>
  </div>
</div>
{{end}}
