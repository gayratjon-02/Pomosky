{{define "timer"}}
<div class="timer" id="timer">
  <svg class="timer-ring" viewBox="0 0 260 260" aria-hidden="true">
    <defs>
      <linearGradient id="ring-grad" x1="0" y1="0" x2="1" y2="1">
        <stop class="stop-a" offset="0"/>
        <stop class="stop-b" offset="1"/>
      </linearGradient>
      <radialGradient id="disc-grad" cx="50%" cy="36%" r="72%">
        <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
        <stop offset="1" stop-color="#060a18" stop-opacity="0.42"/>
      </radialGradient>
    </defs>
    <circle class="ring-ticks" cx="130" cy="130" r="127"/>
    <circle class="ring-disc" cx="130" cy="130" r="112"/>
    <circle class="ring-track" cx="130" cy="130" r="120"/>
    <circle class="ring-progress" id="ring-progress" cx="130" cy="130" r="120"/>
    <g class="ring-knob" id="ring-knob"><circle cx="250" cy="130" r="7"/></g>
  </svg>
  <div class="timer-inner">
    <span class="timer-phase" id="timer-phase">Connecting</span>
    <span class="timer-digits" id="timer-digits" role="timer" aria-live="off">--:--</span>
    <span class="timer-label" id="timer-label"></span>
  </div>
</div>
{{end}}
