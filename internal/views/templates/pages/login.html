{{define "bodyclass"}}auth{{end}}
{{define "content"}}
<canvas id="sky" class="sky-canvas" aria-hidden="true"></canvas>
<section class="auth-wrap">
  <div class="auth-card glass">
    <h1>Log in</h1>
    <p class="muted">Optional. Pomosky works fully without an account. Log in only if you want to keep your focus statistics.</p>
    {{template "flash" .}}

    <form method="post" action="/login" class="stack" id="login-form">
      <input type="hidden" name="csrf" value="{{.CSRFToken}}">
      <button class="btn btn-ghost btn-lg" type="submit" name="provider" value="google">
        <svg viewBox="0 0 24 24" aria-hidden="true" width="20" height="20"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.2h5.9a5 5 0 0 1-2.2 3.3v2.7h3.5c2.1-1.9 3.3-4.7 3.3-8z"/><path fill="#34A853" d="M12 23c3 0 5.4-1 7.2-2.7l-3.5-2.7c-1 .7-2.2 1-3.7 1-2.9 0-5.3-1.9-6.100-4.600H2.300v2.800A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.900 13.900a6.600 6.600 0 0 1 0-4.200V6.900H2.300a11 11 0 0 0 0 9.800z"/><path fill="#EA4335" d="M12 5.400c1.600 0 3.100.6 4.200 1.700l3.100-3.100A11 11 0 0 0 2.300 6.900l3.600 2.800C6.700 7.300 9.100 5.400 12 5.400z"/></svg>
        Continue with Google
      </button>

      <div class="divider"><span>or</span></div>

      <div class="field">
        <label for="email">Email me a sign-in link</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <button class="btn btn-primary btn-lg" type="submit" name="provider" value="magiclink">Send the link</button>
    </form>

    <p class="auth-skip"><a href="/">Continue without an account</a></p>
  </div>
</section>
{{end}}
