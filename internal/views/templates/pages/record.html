{{define "bodyclass"}}record{{end}}
{{define "content"}}
<canvas id="sky" class="sky-canvas" aria-hidden="true"></canvas>
<div class="reaction-layer" id="reaction-layer" aria-hidden="true"></div>

<section class="record-frame">
  <div class="record-top">
    <span class="chip presence"><span class="dot dot-live" id="conn-dot"></span><strong id="viewers">0</strong> <span id="viewers-label">{{$.T "people here"}}</span></span>
    {{template "weather" .}}
    <span class="sr-only" id="conn-text">{{$.T "Connecting"}}</span>
  </div>

  {{template "timer" .}}

  <div class="record-bottom">
    <div class="record-qr" id="qr"></div>
    <div class="record-join">
      <span class="record-join-title">{{$.T "Work with me"}}</span>
      <span class="record-join-url" id="join-url" data-url="{{.Data.ShareURL}}">{{.Data.ShareURL}}</span>
    </div>
  </div>
  <div class="record-attr">{{template "attribution" .}}</div>
</section>
{{end}}
