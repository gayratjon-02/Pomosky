name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: pomosky
          POSTGRES_PASSWORD: pomosky
          POSTGRES_DB: pomosky_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pomosky -d pomosky_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        # -p 1: the database tests share one database and empty its tables.
        run: go test -p 1 ./...
        env:
          TEST_DATABASE_URL: postgres://pomosky:pomosky@localhost:5432/pomosky_test?sslmode=disable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
