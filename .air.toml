# Config for `air` (Go live rebuild), used by `make dev`.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  include_ext = ["go"]
  include_file = [".env"] # the server reads .env at start, so a change restarts it
  exclude_dir = ["tmp", "web", "node_modules", "docs", "deploy", "migrations", "test", ".git"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  stop_on_error = true

[misc]
  clean_on_exit = true
