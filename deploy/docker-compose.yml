# Run from the deploy/ directory:  docker compose up -d --build
# Copy .env.example to .env first and fill in the secrets.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://pomosky:${POSTGRES_PASSWORD}@postgres:5432/pomosky?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    expose:
      - "8080"

  caddy:
    image: caddy:2
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: pomosky
      POSTGRES_DB: pomosky
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pomosky -d pomosky"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # No ports are published: the database is reachable only inside the compose network.

volumes:
  pgdata:
  caddy_data:
  caddy_config:
